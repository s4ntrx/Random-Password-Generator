[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "1.0.0"
description = "Secure random password generator with a desktop GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.gui-scripts]
passgen = "passgen.gui:main"

[tool.setuptools]
packages = ["passgen"]
